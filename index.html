<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <title>Oldagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="images/logo.png" alt="Oldagram logo" class="logo">
            <img src="images/user-avatar.png" alt="user avatar" class="user-avatar">
        </header>
        
        <main class="main">
            <div class="first-post">
                <section class="post-content">
                    <div class="imganddiv">
                        <img src="images/avatar-vangogh.jpg" alt="vinvent vangogh profile image" class="profile-img">
                        <div class="post-profile-name">
                            <p class="profile-name">Vincent van Gogh</p>
                            <p class="location">Zudert, Netherlands</p>   
                        </div>
                    </div>
                    <img src="images/post-vangogh.jpg" alt="" class="post-vangogh">
                </section>
                <section class="post-bottom-content">
                    <div class="post-bottom-content-imgs">
                        <div class="heart">
                            <img src="images/icon-heart.png" alt="heart icon" class="heart-icon">
                        </div>
                        <img src="images/icon-comment.png" alt="comment icon" class="comment">
                        <img src="images/icon-dm.png" alt="dm icon">
                    </div>
                    <p class="like-count">0 likes</p>
                    <div class="post-comment">
                        
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
